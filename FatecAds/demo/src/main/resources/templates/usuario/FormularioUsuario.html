<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuario - FatecADS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .form-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .form-card .card-header {
            background: linear-gradient(135deg, #6f42c1, #59359a);
            color: white;
            border-radius: 16px 16px 0 0 !important;
            padding: 20px 28px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/">
            <i class="bi bi-mortarboard-fill me-2"></i>FatecADS
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>In&iacute;cio</a></li>
                <li class="nav-item"><a class="nav-link" href="/usuarios/listar"><i class="bi bi-person-gear me-1"></i>Usu&aacute;rios</a></li>
                <li class="nav-item"><a class="nav-link" href="/login"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">In&iacute;cio</a></li>
                    <li class="breadcrumb-item"><a href="/usuarios/listar">Usu&aacute;rios</a></li>
                    <li class="breadcrumb-item active">Cadastro</li>
                </ol>
            </nav>

            <div class="card form-card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i>Cadastro de Usu&aacute;rio</h4>
                </div>
                <div class="card-body p-4">
                    <form action="#" th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
                        <input type="hidden" th:field="*{idUsuario}">

                        <div class="mb-3">
                            <label for="nomeUsuario" class="form-label fw-semibold">
                                <i class="bi bi-person me-1 text-primary"></i>Nome
                            </label>
                            <input type="text" class="form-control" id="nomeUsuario"
                                   th:field="*{nomeUsuario}" placeholder="Digite o nome do usuario" required>
                        </div>

                        <div class="mb-3">
                            <label for="emailUsuario" class="form-label fw-semibold">
                                <i class="bi bi-envelope me-1 text-primary"></i>E-mail
                            </label>
                            <input type="email" class="form-control" id="emailUsuario"
                                   th:field="*{emailUsuario}" placeholder="usuario@email.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="senhaUsuario" class="form-label fw-semibold">
                                <i class="bi bi-lock me-1 text-primary"></i>Senha
                            </label>
                            <input type="password" class="form-control" id="senhaUsuario"
                                   th:field="*{senhaUsuario}" placeholder="Digite a senha" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-check-circle me-1"></i>Salvar Usu&aacute;rio
                            </button>
                            <a href="/usuarios/listar" class="btn btn-outline-secondary flex-fill">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
