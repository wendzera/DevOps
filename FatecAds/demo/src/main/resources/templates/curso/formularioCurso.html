<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Curso - FatecADS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .form-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .form-card .card-header { background: linear-gradient(135deg, #0dcaf0, #087990); color: white; border-radius: 16px 16px 0 0 !important; padding: 20px 28px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/">
            <i class="bi bi-mortarboard-fill me-2"></i>FatecADS
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="card form-card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-journal-bookmark-fill me-2"></i>Cadastro de Curso</h4>
                </div>
                <div class="card-body p-4">
                    <form action="#" th:action="@{/cursos/salvar}" th:object="${curso}" method="post">
                        <input type="hidden" th:field="*{idCurso}">

                        <div class="mb-3">
                            <label for="nomeCurso" class="form-label fw-semibold">Nome do Curso</label>
                            <input type="text" class="form-control" id="nomeCurso"
                                   th:field="*{nomeCurso}" placeholder="Ex: Analise e Desenvolvimento de Sistemas" required>
                        </div>

                        <div class="mb-3">
                            <label for="periodoCurso" class="form-label fw-semibold">Periodo</label>
                            <input type="text" class="form-control" id="periodoCurso"
                                   th:field="*{periodoCurso}" placeholder="Ex: Noturno" required>
                        </div>

                        <div class="mb-4">
                            <label for="cargaHorariaCurso" class="form-label fw-semibold">Carga Hor&aacute;ria</label>
                            <input type="number" class="form-control" id="cargaHorariaCurso"
                                   th:field="*{cargaHorariaCurso}" placeholder="Ex: 2800" min="1" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-info text-white flex-fill">
                                <i class="bi bi-check-circle me-1"></i>Salvar Curso
                            </button>
                            <a href="/cursos/listar" class="btn btn-outline-secondary flex-fill">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
