<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - FatecADS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .recovery-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .recovery-card .card-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            border-radius: 16px 16px 0 0 !important;
            padding: 20px 28px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" th:href="@{/}">
            <i class="bi bi-mortarboard-fill me-2"></i>FatecADS
        </a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card recovery-card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-key-fill me-2"></i>Recuperar Senha</h4>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}">Erro</div>
                    <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}">Mensagem</div>

                    <form action="#" th:action="@{/recuperar-senha}" method="post">
                        <div class="mb-4">
                            <label for="emailUsuario" class="form-label fw-semibold">E-mail cadastrado</label>
                            <input type="email" class="form-control" id="emailUsuario"
                                   name="emailUsuario" placeholder="usuario@email.com" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-envelope-check me-1"></i>Enviar Token
                            </button>
                            <a th:href="@{/login}" class="btn btn-outline-secondary flex-fill">
                                <i class="bi bi-arrow-left-circle me-1"></i>Voltar
                            </a>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/redefinir-senha}" class="small text-decoration-none">
                            Ja tenho um token
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
