<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno - FatecADS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .form-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
        }
        .form-card .card-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            border-radius: 16px 16px 0 0 !important;
            padding: 20px 28px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/">
            <i class="bi bi-mortarboard-fill me-2"></i>FatecADS
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Início</a></li>
                <li class="nav-item"><a class="nav-link active" href="/alunos/listar"><i class="bi bi-people me-1"></i>Alunos</a></li>
                <li class="nav-item"><a class="nav-link" href="/professores/listar"><i class="bi bi-person-badge me-1"></i>Professores</a></li>
                <li class="nav-item"><a class="nav-link" href="/disciplinas/listar"><i class="bi bi-book me-1"></i>Disciplinas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">Início</a></li>
                    <li class="breadcrumb-item"><a href="/alunos/listar">Alunos</a></li>
                    <li class="breadcrumb-item active">Novo Aluno</li>
                </ol>
            </nav>

            <div class="card form-card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i>Cadastro de Aluno</h4>
                </div>
                <div class="card-body p-4">
                    <form action="#" th:action="@{/alunos/salvar}" th:object="${aluno}" method="post">
                        <input type="hidden" th:field="*{idAluno}">

                        <div class="mb-3">
                            <label for="nomeAluno" class="form-label fw-semibold">
                                <i class="bi bi-person me-1 text-primary"></i>Nome Completo
                            </label>
                            <input type="text" class="form-control" id="nomeAluno"
                                   th:field="*{nomeAluno}" placeholder="Digite o nome completo" required>
                        </div>

                        <div class="mb-3">
                            <label for="emailAluno" class="form-label fw-semibold">
                                <i class="bi bi-envelope me-1 text-primary"></i>E-mail
                            </label>
                            <input type="email" class="form-control" id="emailAluno"
                                   th:field="*{emailAluno}" placeholder="exemplo@email.com">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="telefoneAluno" class="form-label fw-semibold">
                                    <i class="bi bi-telephone me-1 text-primary"></i>Telefone
                                </label>
                                <input type="text" class="form-control" id="telefoneAluno"
                                       th:field="*{telefoneAluno}" placeholder="11999999999" maxlength="11" required>
                            </div>
                            <div class="col-md-6">
                                <label for="cpfAluno" class="form-label fw-semibold">
                                    <i class="bi bi-card-text me-1 text-primary"></i>CPF
                                </label>
                                <input type="text" class="form-control" id="cpfAluno"
                                       th:field="*{cpfAluno}" placeholder="00000000000" maxlength="11" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="enderecoAluno" class="form-label fw-semibold">
                                <i class="bi bi-geo-alt me-1 text-primary"></i>Endere&ccedil;o
                            </label>
                            <input type="text" class="form-control" id="enderecoAluno"
                                   th:field="*{enderecoAluno}" placeholder="Rua, número, bairro, cidade" required>
                        </div>


                        <div class="mb-4">
                            <label for="raAluno" class="form-label fw-semibold">
                                <i class="bi bi-hash me-1 text-primary"></i>RA (Registro Acad&ecirc;mico)
                            </label>
                            <input type="text" class="form-control" id="raAluno"
                                   th:field="*{raAluno}" placeholder="Digite o RA do aluno" required>
                        </div>

                        <div class="mb-4">
                            <label for="curso" class="form-label fw-semibold">
                                <i class="bi bi-journal-bookmark me-1 text-primary"></i>Curso
                            </label>
                            <select class="form-select" id="curso" th:field="*{curso.idCurso}">
                                <option value="0">Selecione um curso</option>
                                <option th:each="curso : ${cursos}"
                                        th:value="${curso.idCurso}"
                                        th:text="${curso.nomeCurso}">
                                    Curso
                                </option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-check-circle me-1"></i>Salvar Aluno
                            </button>
                            <a href="/alunos/listar" class="btn btn-outline-secondary flex-fill">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
