<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Alunos - FatecADS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .page-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            padding: 28px 0;
        }
        .table-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
            overflow: hidden;
        }
        .table thead th {
            background-color: #f8f9fa;
            font-weight: 600;
            font-size: .85rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            border-bottom: 2px solid #dee2e6;
        }
        .table tbody tr:hover { background-color: #f0f4ff; }
        .badge-ra {
            background-color: #e8f0fe;
            color: #0d6efd;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: .8rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/">
            <i class="bi bi-mortarboard-fill me-2"></i>FatecADS
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Início</a></li>
                <li class="nav-item"><a class="nav-link active" href="/alunos/listar"><i class="bi bi-people me-1"></i>Alunos</a></li>
                <li class="nav-item"><a class="nav-link" href="/professores/listar"><i class="bi bi-person-badge me-1"></i>Professores</a></li>
                <li class="nav-item"><a class="nav-link" href="/disciplinas/listar"><i class="bi bi-book me-1"></i>Disciplinas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h2 class="mb-1"><i class="bi bi-people-fill me-2"></i>Alunos</h2>
            <small class="opacity-75">Listagem de alunos cadastrados</small>
        </div>
        <a href="/alunos/criar" class="btn btn-light fw-semibold">
            <i class="bi bi-plus-lg me-1"></i>Novo Aluno
        </a>
    </div>
</div>

<div class="container py-4">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Início</a></li>
            <li class="breadcrumb-item active">Alunos</li>
        </ol>
    </nav>

    <div class="card table-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th class="px-4 py-3">Nome</th>
                            <th class="py-3">E-mail</th>
                            <th class="py-3">Telefone</th>
                            <th class="py-3">CPF</th>
                            <th class="py-3">RA</th>
                            <th class="py-3 text-center">A&ccedil;&otilde;es</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="aluno : ${alunos}">
                            <td class="px-4 py-3 fw-semibold" th:text="${aluno.nomeAluno}">Nome</td>
                            <td class="py-3" th:text="${aluno.emailAluno}">email@dominio.com</td>
                            <td class="py-3" th:text="${aluno.telefoneAluno}">11999999999</td>
                            <td class="py-3" th:text="${aluno.cpfAluno}">00000000000</td>
                            <td class="py-3">
                                <span class="badge-ra" th:text="${aluno.raAluno}">RA</span>
                            </td>
                            <td class="py-3 text-center">
                                <a th:href="@{/alunos/editar/{id}(id=${aluno.idAluno})}"
                                   class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/alunos/excluir/{id}(id=${aluno.idAluno})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Deseja excluir este aluno?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(alunos)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-inbox display-6 d-block mb-2"></i>
                                Nenhum aluno cadastrado.
                                <a href="/alunos/criar" class="d-block mt-2">Cadastrar primeiro aluno</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
