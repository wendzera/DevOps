<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Disciplina - FatecADS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .form-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .form-card .card-header {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            color: #212529;
            border-radius: 16px 16px 0 0 !important;
            padding: 20px 28px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/">
            <i class="bi bi-mortarboard-fill me-2"></i>FatecADS
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Início</a></li>
                <li class="nav-item"><a class="nav-link" href="/alunos/listar"><i class="bi bi-people me-1"></i>Alunos</a></li>
                <li class="nav-item"><a class="nav-link" href="/professores/listar"><i class="bi bi-person-badge me-1"></i>Professores</a></li>
                <li class="nav-item"><a class="nav-link active" href="/disciplinas/listar"><i class="bi bi-book me-1"></i>Disciplinas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">Início</a></li>
                    <li class="breadcrumb-item"><a href="/disciplinas/listar">Disciplinas</a></li>
                    <li class="breadcrumb-item active">Nova Disciplina</li>
                </ol>
            </nav>

            <div class="card form-card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-book-fill me-2"></i>Cadastro de Disciplina</h4>
                </div>
                <div class="card-body p-4">
                    <form action="#" th:action="@{/disciplinas/salvar}" th:object="${disciplina}" method="post">

                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">
                                <i class="bi bi-book me-1 text-warning"></i>Nome da Disciplina
                            </label>
                            <input type="text" class="form-control" id="nome"
                                   th:field="*{nome}" placeholder="Ex: Programação Orientada a Objetos" required>
                        </div>

                        <div class="mb-3">
                            <label for="sigla" class="form-label fw-semibold">
                                <i class="bi bi-tag me-1 text-warning"></i>Sigla
                            </label>
                            <input type="text" class="form-control" id="sigla"
                                   th:field="*{sigla}" placeholder="Ex: POO" maxlength="10" required>
                        </div>

                        <div class="mb-4">
                            <label for="cargaHoraria" class="form-label fw-semibold">
                                <i class="bi bi-clock me-1 text-warning"></i>Carga Hor&aacute;ria (horas)
                            </label>
                            <input type="number" class="form-control" id="cargaHoraria"
                                   th:field="*{cargaHoraria}" placeholder="Ex: 80" min="1" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning flex-fill fw-semibold">
                                <i class="bi bi-check-circle me-1"></i>Salvar Disciplina
                            </button>
                            <a href="/disciplinas/listar" class="btn btn-outline-secondary flex-fill">
                                <i class="bi bi-x-circle me-1"></i>Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
