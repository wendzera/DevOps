<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
</head>
<body>
    <h1>Cadastro de Alunos</h1>
    <form action="#" th:action="@{/alunos/salvar}" th:object="${aluno}" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required><br><br>
        
        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" th:field="*{telefone}" required><br><br>
        
        <label for="endereco">endereço:</label>
        <input type="text" id="endereco" th:field="*{endereco}" required><br><br>
        
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" th:field="*{cpf}" required><br><br>

        <label for="ra">RA:</label>
        <input type="text" id="ra" th:field="*{ra}" required><br><br>

        <button type="submit">Salvar</button>
    
    
</body>
</html>
