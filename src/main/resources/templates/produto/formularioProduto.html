<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${produto.idProduto == null ? 'Cadastrar produto' : 'Editar produto'}">Produto</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 20px; color: #222; }
        form { display: grid; gap: 8px; }
        input { padding: 10px; font-size: 16px; }
        button, .voltar { display: inline-block; padding: 10px 16px; margin-top: 10px; text-decoration: none; }
        .erro { color: #a40000; background: #ffe8e8; padding: 12px; border-radius: 4px; }
        .foto-atual { max-width: 220px; max-height: 160px; object-fit: contain; border: 1px solid #ddd; padding: 4px; }
        .acoes { display: flex; gap: 10px; align-items: center; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navegacao :: botaoVoltar}"></div>
    <h1 th:text="${produto.idProduto == null ? 'Cadastro de Produto' : 'Editar Produto'}">Produto</h1>
    <p class="erro" th:if="${erro}" th:text="${erro}"></p>
    <form th:action="@{/produtos/salvar}" method="post" enctype="multipart/form-data" th:object="${produto}">
        <input type="hidden" th:field="*{idProduto}">

        <label for="descricaoProduto">Descrição do Produto</label>
        <input type="text" id="descricaoProduto" th:field="*{descricaoProduto}" maxlength="40" required>

        <label for="valorProduto">Valor do Produto</label>
        <input type="number" id="valorProduto" th:field="*{valorProduto}" min="0" step="0.01" required>

        <label for="unidadeProduto">Unidade</label>
        <input type="text" id="unidadeProduto" th:field="*{unidadeProduto}" maxlength="10" required>

        <label for="marcaProduto">Marca</label>
        <input type="text" id="marcaProduto" th:field="*{marcaProduto}" maxlength="30" required>

        <label for="quantidadeProduto">Quantidade</label>
        <input type="number" id="quantidadeProduto" th:field="*{quantidadeProduto}" min="0" step="1" required>

        <div th:if="${produto.idProduto != null and produto.nomeImagemProduto != null}">
            <p>Foto atual:</p>
            <img class="foto-atual" th:src="@{/produtos/imagem/{id}(id=${produto.idProduto})}" alt="Foto atual do produto">
        </div>

        <label for="imagem" th:text="${produto.nomeImagemProduto == null ? 'Foto do produto' : 'Substituir foto (opcional)'}">Foto do produto</label>
        <input type="file" name="imagem" id="imagem" accept="image/*">
        <small>Formatos de imagem, até 5 MB. Ao editar sem selecionar arquivo, a foto atual será mantida.</small>

        <div class="acoes">
            <button type="submit">Salvar Produto</button>
            <a class="voltar" th:href="@{/produtos/listar}">Cancelar</a>
        </div>
    </form>
</body>
</html>
