<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuarios - FatecADS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .page-header { background: linear-gradient(135deg, #6f42c1, #59359a); color: white; padding: 28px 0; }
        .table-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); overflow: hidden; }
        .table thead th { background-color: #f8f9fa; font-weight: 600; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; border-bottom: 2px solid #dee2e6; }
        .table tbody tr:hover { background-color: #f7f2ff; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="/">
            <i class="bi bi-mortarboard-fill me-2"></i>FatecADS</a>
    </div>
</nav>

<div class="page-header">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h2 class="mb-1"><i class="bi bi-person-gear me-2"></i>Usuario</h2>
            <small class="opacity-75">Listagem de usuarios cadastrados</small>
        </div>
        <a href="/usuarios/criar" class="btn btn-light fw-semibold">
            <i class="bi bi-plus-lg me-1"></i>Novo Usuario</a>
    </div>
</div>

<div class="container py-4">
    <div class="card table-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th class="px-4 py-3">Nome</th>
                            <th class="py-3">E-mail</th>
                            <th class="py-3 text-center">A&ccedil;&otilde;es</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td class="px-4 py-3 fw-semibold" th:text="${usuario.nomeUsuario}">Nome</td>
                            <td class="py-3" th:text="${usuario.emailUsuario}">email@dominio.com</td>
                            <td class="py-3 text-center">
                                <a th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}"
                                   class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/usuarios/excluir/{id}(id=${usuario.idUsuario})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Deseja excluir este usuario?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="3" class="text-center text-muted py-5">
                                <i class="bi bi-inbox display-6 d-block mb-2"></i>
                                Nenhum usuario cadastrado.
                                <a href="/usuarios/criar" class="d-block mt-2">Cadastrar primeiro usuario</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
